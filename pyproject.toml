[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regclock"
version = "0.1.0"
description = "Incident-reporting deadline calculator for DORA, NIS2, GDPR, FINMA, the Swiss ISA and CERT-In, with every rule cited. CLI and MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ravirajsinh Padhiar" }]
keywords = ["dora", "nis2", "finma", "cert-in", "gdpr", "incident-response", "grc", "compliance", "mcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "mcp>=1.2"]

[project.scripts]
regclock = "regclock.cli:main"

[project.urls]
Homepage = "https://github.com/ravirajsinhpadhiar/regclock"

[tool.hatch.build.targets.wheel]
packages = ["src/regclock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
